[pytest]
# Two xdist workers by default. `--dist loadscope` keeps each test class/module on one worker, because
# the tests in a class share state and run against one backend.
# Run serially with `-n 0` (not `-p no:xdist`, which errors because addopts still passes -n/--dist).
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope
